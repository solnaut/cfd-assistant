<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="CFD Assistant is an independent learning and calculation aid for CFD engineers and Ansys Fluent beginners."
    />
    <title>CFD Assistant</title>
    <script>
      ;(function () {
        try {
          var key = 'cfd-assistant:spa-redirect'
          var redirect = window.sessionStorage.getItem(key)
          if (!redirect) return
          window.sessionStorage.removeItem(key)
          if (redirect.startsWith('/') && !redirect.startsWith('//')) {
            window.history.replaceState(null, '', redirect)
          }
        } catch {
          // Ignore storage restrictions.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
